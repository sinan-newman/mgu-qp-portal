name: Automated University Portal Sync

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions anytime with 1 click

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Portal Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pypdf

      - name: Run Assist QP & Scheme Sync
        env:
          STORAGE_PAT: ${{ secrets.STORAGE_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_engine.py --trigger=automatic

      - name: Run MGU FYUGP Model Question Papers Scraper & Splitter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/scrape_mgu_model_papers.py
          mkdir -p public/data public/uploads
          cp -r data/* public/data/ || true
          cp -r uploads/* public/uploads/ || true

      - name: Commit and Push Changes if Any
        run: |
          git config user.name "MGU Auto-Sync Bot"
          git config user.email "bot@mgu-portal.local"
          git add data/ public/data/ uploads/ public/uploads/
          if git diff --staged --quiet; then
            echo "No new question papers found. Database is already up to date."
          else
            git commit -m "Automated sync: ingest latest QP, schemes, and FYUGP model papers [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
